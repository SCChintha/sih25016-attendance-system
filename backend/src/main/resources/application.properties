spring.application.name=smartattend

# The default local database is MySQL. The JDBC option creates `smartattend`
# when it does not exist, and Flyway creates the tables on first startup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartattend?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway is the only schema writer so that a fresh MySQL database receives the
# same versioned schema as every other environment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
app.security.jwt-secret=${JWT_SECRET}
app.security.token-lifetime=${JWT_TOKEN_LIFETIME:PT8H}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.admin.name=${SUPER_ADMIN_NAME:}
app.bootstrap.admin.password=${SUPER_ADMIN_PASSWORD:}
