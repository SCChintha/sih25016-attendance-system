spring.application.name=smartattend

# Default (no active profile) is the persistent local H2 database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/smartattend;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Saich@2889}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

server.port=${SERVER_PORT:8080}
app.security.jwt-secret=${JWT_SECRET:replace-this-development-secret-with-32-bytes-minimum}
app.security.token-lifetime=${JWT_TOKEN_LIFETIME:PT8H}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.admin.name=${SUPER_ADMIN_NAME:}
app.bootstrap.admin.password=${SUPER_ADMIN_PASSWORD:}
